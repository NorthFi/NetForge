<!doctype html>
<!-- root/index.html -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>NetForge | ISP Manager</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e8eef9;background:#0c1422}*{box-sizing:border-box}body{margin:0}header{padding:18px 26px;background:#131f32;border-bottom:1px solid #2c3b50;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}h2{font-size:21px}small,.muted{color:#9baec9}main{max-width:1250px;margin:28px auto;padding:0 18px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #345077;background:#203651;color:#fff;border-radius:8px;padding:10px 14px}button:hover{background:#315174}button.primary{background:#1767d2;border-color:#1767d2}button.danger{color:#ffb6b6}input,select,textarea{width:100%;padding:11px;background:#0e1929;color:white;border:1px solid #3b4d67;border-radius:8px}label{display:block;margin:13px 0 6px;color:#afc1d8}.card{background:#162438;border:1px solid #30415a;border-radius:13px;padding:20px}.login{max-width:450px;margin:8vh auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.metric{font-size:30px;font-weight:700;margin-top:8px}.layout{display:grid;grid-template-columns:210px 1fr;gap:22px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{text-align:left}.nav button.active{background:#1767d2}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:15px}table{width:100%;border-collapse:collapse}td,th{padding:13px;text-align:left;border-bottom:1px solid #30415a}th{color:#9fb3ce}dialog{background:#162438;color:white;border:1px solid #476080;border-radius:12px;width:min(520px,95vw)}dialog::backdrop{background:#0009}.notice{padding:12px;background:#273b54;border-radius:8px;margin:12px 0}#message{min-height:20px;color:#ffcc85}@media(max-width:750px){.layout{grid-template-columns:1fr}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap}table{display:block;overflow-x:auto}}
</style></head><body><header><div><h1>⚙ NetForge</h1><small>ISP Operations Platform</small></div><button id="logout" hidden>Sign out</button></header><main id="app"></main><script>
'use strict';
// root/index.html — all data is fetched from authenticated PHP endpoints.
const api='api/index.php', categories=['customers','highsites','sectors','equipment','backhauls','scripts','jobs'];
const labels={customers:'Customers',highsites:'Highsites',sectors:'Sectors',equipment:'Equipment',backhauls:'Backhauls',scripts:'Script Library',jobs:'Automation Jobs'};
let csrf='',current='dashboard',cache={};
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(params={},method='GET',payload=null){const url=api+'?'+new URLSearchParams(params);const opts={method,credentials:'same-origin',headers:{}};if(method!=='GET')opts.headers['X-CSRF-Token']=csrf;if(payload!==null){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(payload)}const res=await fetch(url,opts);const data=await res.json();if(!res.ok)throw Error(data.error||'Request failed');return data}
function message(s){const m=document.querySelector('#message');if(m)m.textContent=s}
async function boot(){try{const status=await request({action:'status'});csrf=status.csrf||'';if(!status.authenticated){login(status.installed);return}document.querySelector('#logout').hidden=false;await render()}catch(e){app.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function login(installed){document.querySelector('#logout').hidden=true;app.innerHTML='<section class="card login"><h2>'+(installed?'Sign in':'Initial administrator setup')+'</h2><p class="muted">'+(installed?'Enter your administrator credentials.':'Create the first administrator account. Use a unique password of at least 14 characters.')+'</p><form id="auth"><label>Username</label><input name="username" required minlength="3" maxlength="40" autocomplete="username"><label>Password</label><input name="password" type="password" required minlength="'+(installed?1:14)+'" autocomplete="'+(installed?'current-password':'new-password')+'"><p id="message"></p><button class="primary" type="submit">'+(installed?'Sign in':'Create administrator')+'</button></form></section>';document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const r=await request({action:installed?'login':'setup'},'POST',b);csrf=r.csrf;await boot()}catch(err){message(err.message)}}}
async function render(){app.innerHTML='<div class="layout"><nav class="nav" id="nav"></nav><section id="content"><p>Loading…</p></section></div>';const nav=document.querySelector('#nav');for(const key of ['dashboard',...categories]){const b=document.createElement('button');b.textContent=key==='dashboard'?'Dashboard':labels[key];b.className=key===current?'active':'';b.onclick=()=>{current=key;render()};nav.append(b)}try{if(current==='dashboard'){await Promise.all(categories.map(async c=>cache[c]=await request({category:c})));document.querySelector('#content').innerHTML='<h2>Network overview</h2><div class="grid">'+categories.map(c=>'<div class="card"><div class="muted">'+esc(labels[c])+'</div><div class="metric">'+cache[c].length+'</div></div>').join('')+'</div><div class="notice">Network monitoring and remote script execution require a separately deployed, authenticated automation agent. No device commands are executed by this website.</div>'}else{cache[current]=await request({category:current});drawCategory()}}catch(e){document.querySelector('#content').textContent=e.message}}
function resolve(c,id){return (cache[c]||[]).find(x=>x.id===id)?.name||id||'—'}
function drawCategory(){const rows=cache[current];const content=document.querySelector('#content');content.innerHTML='<div class="toolbar"><h2>'+esc(labels[current])+'</h2><div><button id="export">Export CSV</button> <button id="add" class="primary">+ Add record</button></div></div><p id="message"></p><div class="card" style="overflow:auto"><table><thead><tr><th>Name</th><th>Description</th><th>Relationship</th><th>Created</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.highsite_id?resolve('highsites',r.highsite_id):r.sector_id?resolve('sectors',r.sector_id):'—')+'</td><td>'+esc((r.created_at||'').slice(0,10))+'</td><td><button class="danger" data-delete="'+esc(r.id)+'">Delete</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<p class="muted">No records yet.</p>')+'</div>';document.querySelector('#add').onclick=showForm;document.querySelector('#export').onclick=exportCsv;content.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this record?'))return;try{await request({category:current,id:b.dataset.delete},'DELETE');await render()}catch(e){message(e.message)}})}
function exportCsv(){const rows=cache[current],cols=['id','name','description','highsite_id','sector_id','created_at'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[cols.map(quote).join(','),...rows.map(r=>cols.map(k=>quote(r[k])).join(','))].join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='netforge-'+current+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showForm(){if(current==='jobs'){message('Execution is disabled until a secure agent is connected.');return}const d=document.createElement('dialog');const rel=['sectors','equipment','backhauls'].includes(current)?'highsites':current==='customers'?'sectors':null;const field=rel?'<label>Associated '+(rel==='highsites'?'highsite':'sector')+'</label><select name="'+(rel==='highsites'?'highsite_id':'sector_id')+'"><option value="">Unassigned</option>'+(cache[rel]||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select>':'';d.innerHTML='<form id="record"><h2>New '+esc(labels[current])+' record</h2><label>Name</label><input name="name" maxlength="160" required autofocus><label>Description / notes</label><textarea name="description" maxlength="2000" rows="4"></textarea>'+field+'<p id="dialogmessage"></p><div class="toolbar"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save record</button></div></form>';document.body.append(d);d.showModal();d.querySelector('#cancel').onclick=()=>d.close();d.onclose=()=>d.remove();d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await request({category:current},'POST',Object.fromEntries(new FormData(e.target)));d.close();await render()}catch(err){d.querySelector('#dialogmessage').textContent=err.message}}}
document.querySelector('#logout').onclick=async()=>{try{await request({action:'logout'},'POST');csrf='';current='dashboard';await boot()}catch(e){alert(e.message)}};boot();
</script></body></html>
