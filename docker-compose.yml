version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: netforge_db
    environment:
      POSTGRES_USER: netforge
      POSTGRES_PASSWORD: netforge_dev_password
      POSTGRES_DB: netforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netforge_api
    command: python app.py
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://netforge:netforge_dev_password@db:5432/netforge
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-key-change-in-production
      BACKUP_STORAGE_PATH: /app/backups
      CONFIG_STORAGE_PATH: /app/configs
    volumes:
      - ./backend:/app
      - ./backups:/app/backups
      - ./configs:/app/configs
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: netforge_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  default:
    name: netforge_network
