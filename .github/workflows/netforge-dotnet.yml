# root/.github/workflows/netforge-dotnet.yml
name: NetForge .NET 11 self-host validation
on:
  push:
    branches: [netforge-selfhost-dotnet]
  pull_request:
    paths:
      - 'selfhost/**'
      - '.github/workflows/netforge-dotnet.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netforge_ci
          POSTGRES_PASSWORD: netforge_test_very_strong_secret
          POSTGRES_DB: netforge_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U netforge_ci -d netforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Validate C# and NuGet references
        run: dotnet build selfhost/src/NetForge.Api/NetForge.Api.csproj --configuration Release
      - name: Validate browser JavaScript
        run: node --check selfhost/web/app.js
      - name: Validate FreeRADIUS bootstrap shell
        run: sh -n selfhost/radius/entrypoint.sh
      - name: Check compose syntax
        shell: bash
        run: |
          cp selfhost/.env.example selfhost/.env
          cd selfhost
          docker compose config --quiet
      - name: Build publish output
        run: dotnet publish selfhost/src/NetForge.Api/NetForge.Api.csproj -c Release -o /tmp/netforge-publish --no-restore
      - name: Integration test with PostgreSQL 17
        run: bash selfhost/tests/smoke.sh
      - name: Build and exercise FreeRADIUS with PostgreSQL-backed subscriber
        run: bash selfhost/tests/radius-smoke.sh
