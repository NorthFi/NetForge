# root/.github/workflows/netforge-dotnet.yml
name: NetForge .NET 11 self-host validation
on:
  push:
    branches: [netforge-selfhost-dotnet]
  pull_request:
    paths:
      - 'selfhost/**'
      - '.github/workflows/netforge-dotnet.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netforge_ci
          POSTGRES_PASSWORD: netforge_test_very_strong_secret
          POSTGRES_DB: netforge_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U netforge_ci -d netforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Validate C# and NuGet references
        run: dotnet build selfhost/src/NetForge.Api/NetForge.Api.csproj --configuration Release
      - name: Validate browser JavaScript
        run: |
          node --check selfhost/web/app.js
          node --check selfhost/web/telemetry.js
          node --check selfhost/web/rf-console.js
          node --check selfhost/web/noc-console.js
          node --check selfhost/web/assurance-console.js
          node --check selfhost/web/assurance-controls.js
          node --check selfhost/web/subscriber-probes.js
          node --check selfhost/web/portal/app.js
      - name: Validate FreeRADIUS bootstrap shell
        run: sh -n selfhost/radius/entrypoint.sh
      - name: Check compose syntax
        shell: bash
        run: |
          cp selfhost/.env.example selfhost/.env
          cd selfhost
          docker compose config --quiet
      - name: Build publish output
        run: dotnet publish selfhost/src/NetForge.Api/NetForge.Api.csproj -c Release -o /tmp/netforge-publish --no-restore
      - name: Validate test script syntax
        run: |
          bash -n selfhost/tests/smoke.sh
          bash -n selfhost/tests/rf-smoke.sh
          bash -n selfhost/tests/noc-smoke.sh
          bash -n selfhost/tests/assurance-smoke.sh
          bash -n selfhost/tests/sla-probes-smoke.sh
          bash -n selfhost/tests/subscriber-probes-smoke.sh
          bash -n selfhost/tests/staff-security-smoke.sh
          bash -n selfhost/tests/snmpv3-wire-smoke.sh
          bash -n selfhost/tests/billing-upgrade-smoke.sh
          bash -n selfhost/tests/radius-smoke.sh
      - name: Validate subscriber probe agent TLS and timeout behavior
        run: python3 selfhost/tests/test_probe_agent.py
      - name: Install Net-SNMP CLI and test agent
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq snmp snmpd
      - name: Validate real SNMPv3 SHA-256/AES polling
        run: bash selfhost/tests/snmpv3-wire-smoke.sh
      - name: Integration test with PostgreSQL 17
        run: bash selfhost/tests/smoke.sh
      - name: Validate staff session lifecycle with isolated rate limiter
        run: bash selfhost/tests/staff-security-smoke.sh
      - name: Upgrade legacy billing data to immutable journal
        run: bash selfhost/tests/billing-upgrade-smoke.sh
      - name: Build and exercise FreeRADIUS with PostgreSQL-backed subscriber
        run: bash selfhost/tests/radius-smoke.sh
