# root/selfhost/compose.yaml
# Linux host recommended for UDP RADIUS. Windows host requires Docker Desktop/WSL2.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
      POSTGRES_DB: "${POSTGRES_DB:-netforge}"
    volumes:
      - netforge_pg:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-netforge}"]
      interval: 5s
      timeout: 5s
      retries: 25
    networks: [private]
  api:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-netforge};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true"
      NETFORGE_ADMIN_USER: "${NETFORGE_ADMIN_USER:?Required}"
      NETFORGE_ADMIN_PASSWORD: "${NETFORGE_ADMIN_PASSWORD:?Required}"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      - "127.0.0.1:${NETFORGE_HTTP_PORT:-8080}:8080"
    volumes:
      - netforge_keys:/app/keys
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -r /app/NetForge.Api.dll"]
      interval: 15s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2.10
    profiles: ["https"]
    restart: unless-stopped
    environment:
      NETFORGE_DOMAIN: "${NETFORGE_DOMAIN:-netforge.localhost}"
    ports:
      - "${NETFORGE_HTTPS_BIND_IP:-127.0.0.1}:${NETFORGE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks: [private]
  radius:
    build:
      context: ..
      dockerfile: selfhost/radius/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
      POSTGRES_DB: "${POSTGRES_DB:-netforge}"
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    networks: [private]
    ports:
      - "${RADIUS_BIND_IP:-0.0.0.0}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-0.0.0.0}:1813:1813/udp"
networks:
  private: {}
volumes:
  netforge_pg: {}
  netforge_keys: {}
  caddy_data: {}
  caddy_config: {}
